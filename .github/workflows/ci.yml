# ═══════════════════════════════════════════════════════════════════════════
# 🛡️ CI En-Check Web — Intégration Continue (Chantier VD-13)
# ═══════════════════════════════════════════════════════════════════════════
# POURQUOI : Aucune branche cassée ou régression sur les calculs financiers
# (hoursCalculator, taxationService, payrollService) ne doit pouvoir être
# fusionnée dans `main`.

name: CI — En-Check Web (Gardien des fondations)

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging, develop]

jobs:
  verify-web:
    name: Tests financiers, Lint & Build (Node 20)
    runs-on: ubuntu-latest

    env:
      VITE_APP_ENV: test
      VITE_SUPABASE_URL: https://staging-ci.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-anon-key-placeholder

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Test IA isolé — authentification, quotas et sortie contrôlée
        run: node --test tests/edge/test-ai-search.mjs

      - name: Exécution des tests unitaires financiers (VD-15)
        run: npm test

      # ⚠️ Ajouté le 16/10 : le lint était promis par le nom du job (« Tests
      # financiers, Lint & Build ») mais aucun step ne l'exécutait. C'est exactement lui
      # qui voyait les cinq identifiants libres de Pointages.jsx —
      # 'canEditPointages' is not defined — avant la mise en prod, pour rien.
      # On ne lance pas `npm run lint` ici : le dépôt traîne ~367 remarques
      # stylistiques, et une porte rouge le premier jour reste rouge pour toujours.
      # `eslint.gate.config.js` ne garde que les règles qui décrivent un crash.
      - name: Porte de lint (no-undef, règles des hooks) — ce qui casse à l'exécution
        run: npx eslint src --config eslint.gate.config.js

      - name: Construction du bundle de production (Vite Build)
        run: npm run build

[functions.send-push]
enabled = true
verify_jwt = true
import_map = "./functions/send-push/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/send-push/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/send-push/*.html" ]


[functions.send-email]
enabled = true
# The function verifies either the shared x-email-secret or a superadmin JWT itself.
# JWT verification is disabled at the gateway so PostgreSQL pg_net can use the shared secret.
verify_jwt = false
entrypoint = "./functions/send-email/index.ts"

[functions.test-ai-search]
enabled = true
# Auth is validated explicitly with getUser inside the function, followed by
# an active super_admin lookup. This also supports newer asymmetric JWTs.
verify_jwt = false
entrypoint = "./functions/test-ai-search/index.ts"

[functions.assistant-explain]
enabled = true
verify_jwt = false
entrypoint = "./functions/assistant-explain/index.ts"

[functions.assistant-chat]
enabled = true
verify_jwt = false
entrypoint = "./functions/assistant-chat/index.ts"

[functions.admin-invitations]
enabled = true
# Explicit getUser + caller-context authorization RPC before any privileged call.
verify_jwt = false
entrypoint = "./functions/admin-invitations/index.ts"

[functions.admin-mfa-recovery]
enabled = true
verify_jwt = false
entrypoint = "./functions/admin-mfa-recovery/index.ts"

[functions.admin-retirement]
enabled = true
verify_jwt = false
entrypoint = "./functions/admin-retirement/index.ts"

[functions.pointage-enrollment-photo]
enabled = true
# The handler verifies the application token via caller-context RPC, no cookies.
verify_jwt = false
entrypoint = "./functions/pointage-enrollment-photo/index.ts"

<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- D-005 — anti-clignotement : le thème est posé avant le premier rendu.
         encheck.theme = 'clair' | 'sombre', clair par défaut ; l'ancien
         choix (encheck_admin_dark_mode_v2) est migré une fois. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('encheck.theme');
          var sombre = saved === 'sombre';
          if (saved !== 'clair' && saved !== 'sombre') {
            var legacy = localStorage.getItem('encheck_admin_dark_mode_v2');
            sombre = legacy !== null && legacy !== 'false';
          }
          document.documentElement.dataset.theme = sombre ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    
    <!-- ✅ VIEWPORT CORRIGÉ (sans user-scalable=no) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#2A1708" />
    <meta name="description" content="En-Check - Gestion de pointage intelligente pour entreprises" />
    
    <!-- iOS Support -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="En-Check" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    
    <!-- ❌ SUPPRIMÉ : VitePWA l'injecte automatiquement -->
    <!-- <link rel="manifest" href="/manifest.json" /> -->

    <!-- 🌍 LEAFLET CSS (chargement asynchrone) -->

      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link

        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""
      />
    </noscript>
    
    <title>En-Check | Administration</title>
  </head>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
